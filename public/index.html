<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page No Longer Available</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 20px;
      font-weight: 700;
    }
    p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }
    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    .footer-link {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e0e0e0;
      font-size: 0.9rem;
      color: #888;
    }
    @media (max-width: 640px) {
      h1 {
        font-size: 1.5rem;
      }
      p {
        font-size: 1rem;
      }
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <!--

      or contact the project maintainers.

    <div class="footer-link">
      <a href="https://github.com/ataymia/flowmaster" target="_blank" rel="noopener noreferrer">
